<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile Page Editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--blue:#2340ff;--blue-soft:#e9ecff;--ink:#0b0b10;--mute:#8d8d99;--line:#e3e4ec;--bg:#f4f5f9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard',-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;font-size:14px;line-height:1.5}
button{font:inherit;cursor:pointer}

/* top bar */
.bar{height:58px;flex:none;display:flex;align-items:center;gap:16px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-size:12px;letter-spacing:.2em;font-weight:800;white-space:nowrap}
.brand b{color:var(--blue)}
.bar-mid{display:flex;gap:10px;margin:0 auto}
.seg{display:flex;border:1.5px solid var(--ink)}
.seg button{border:0;background:#fff;font-weight:800;font-size:12px;letter-spacing:.1em;padding:7px 14px}
.seg button.on{background:var(--ink);color:#fff}
.seg-lb{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--mute);align-self:center}
.bar-r{display:flex;align-items:center;gap:8px}
.status{font-size:12px;color:var(--mute);margin-right:4px;white-space:nowrap}
.btn{font-weight:800;font-size:13px;padding:9px 14px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1a31d6}
.btn.warn{border-color:#d33;color:#d33}

/* layout */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:480px 1fr}
.panel{display:flex;flex-direction:column;min-height:0;background:#fff;border-right:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:#fff;padding:14px 6px;font-weight:800;font-size:13px;color:var(--mute);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--blue)}
.form{overflow:auto;padding:18px;flex:1}
.stage{min-height:0;display:flex;justify-content:center;padding:18px;overflow:auto}
.frame{width:100%;height:100%;background:#fff;box-shadow:0 8px 40px rgba(20,20,60,.12);transition:width .3s}
.frame.mobile{width:390px;flex:none}
iframe{width:100%;height:100%;border:0;display:block}

/* form parts */
.tip{background:var(--blue-soft);color:#1b2fb8;padding:12px 14px;font-size:13px;margin-bottom:14px;line-height:1.6}
details{border:1px solid var(--line);margin-bottom:14px;background:#fff}
summary{padding:13px 14px;font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--blue);font-weight:800}
details[open] > summary::after{content:"－"}
details[open] > summary{border-bottom:1px solid var(--line)}
.in{padding:14px}
.f{display:block;margin-bottom:12px}
.lb{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--mute);margin-bottom:5px}
input[type=text],textarea,select{width:100%;border:1px solid #d6d7e2;padding:9px 10px;font:inherit;background:#fff;color:var(--ink);border-radius:0}
textarea{resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.sub{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--blue);margin:18px 0 8px}
.list{display:grid;gap:10px}
.li{border:1px solid var(--line);border-left:3px solid var(--blue);padding:10px 12px;background:#fafbff}
.li-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px}
.acts{display:flex;gap:4px}
.mini{width:26px;height:26px;border:1px solid #d6d7e2;background:#fff;font-size:12px;font-weight:800}
.mini:hover{border-color:var(--blue);color:var(--blue)}
.add{border:1.5px dashed var(--blue);background:#fff;color:var(--blue);font-weight:800;padding:9px;font-size:13px}
.add:hover{background:var(--blue-soft)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.row2{display:grid;grid-template-columns:110px 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap}
.img{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
.thumb{width:72px;height:90px;background:var(--bg) center/cover no-repeat;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute);text-align:center}
.img .btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sbtn{border:1.5px solid var(--ink);background:#fff;font-weight:800;font-size:12px;padding:6px 10px}
.sbtn.blue{border-color:var(--blue);color:var(--blue)}
.hint{font-size:11px;color:var(--mute);margin-top:4px}
.tgrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.tg{display:inline-flex;align-items:center;gap:8px;border:1.5px solid #c9cbe0;background:#fff;color:var(--mute);padding:4px 11px 4px 5px;font-weight:800;font-size:12px;letter-spacing:.08em;white-space:nowrap}
.tg .k{width:30px;height:16px;border-radius:99px;background:#c9cbe0;position:relative;transition:.2s;flex:none}
.tg .k::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{border-color:var(--blue);color:var(--blue)}
.tg.on .k{background:var(--blue)}
.tg.on .k::after{left:16px}

@media (max-width:960px){
  body{height:auto;min-height:100%}
  .bar{flex-wrap:wrap;height:auto;padding:10px 14px}
  .bar-mid{margin:0}
  .layout{grid-template-columns:1fr;grid-template-rows:auto 80vh}
  .panel{border-right:0;border-bottom:1px solid var(--line)}
  .form{max-height:70vh}
}
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><b>PROFILE PAGE</b> EDITOR</div>
  <div class="bar-mid">
    <span class="seg-lb">화면</span>
    <div class="seg" id="segDevice"><button data-d="desktop" class="on">PC</button><button data-d="mobile">모바일</button></div>
    <span class="seg-lb">미리보기</span>
    <div class="seg" id="segMode"><button data-m="off" class="on">OFF</button><button data-m="on">ON</button></div>
  </div>
  <div class="bar-r">
    <span class="status" id="status">자동 저장됨</span>
    <button class="btn" id="btnLoad" title="저장해 둔 JSON 불러오기">불러오기</button>
    <button class="btn" id="btnSave" title="편집 내용을 JSON으로 저장">JSON 저장</button>
    <button class="btn warn" id="btnReset">초기화</button>
    <button class="btn" id="btnImage" title="페이지 전체를 이미지(PNG)로 저장">이미지 저장</button>
    <button class="btn" id="btnBlog" title="티스토리 글쓰기의 HTML 모드에 붙여넣는 용도로 복사">티스토리용 복사</button>
    <button class="btn" id="btnCopy">HTML 복사</button>
    <button class="btn primary" id="btnExport">HTML 내보내기</button>
  </div>
</header>

<div class="layout">
  <aside class="panel">
    <nav class="tabs" id="tabs"></nav>
    <div class="form" id="form"></div>
  </aside>
  <section class="stage">
    <div class="frame" id="frame"><iframe id="preview" title="미리보기"></iframe></div>
  </section>
</div>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<!-- ================= 내보내기용 뷰어 템플릿 (편집기 화면에는 영향 없음) ================= -->
<script type="text/plain" id="v-css">
:root{
  --blue:#2340ff;--blue-text:#2340ff;--blue-soft:#e9ecff;--bg:#ffffff;--card:#ffffff;--ink:#0b0b10;
  --text:#4a4a55;--mute:#8d8d99;--line:#e6e6ec;--focus:#2340ff;--tag-k-bg:#0b0b10;--tag-k-fg:#ffffff;--fade:rgba(255,255,255,.85);
}
body[data-mode="on"]{
  --blue-text:#7d92ff;--blue-soft:#161a3c;--bg:#0c0d12;--card:#12131a;--ink:#ffffff;--text:#b4b5c0;
  --mute:#7c7d8b;--line:#252631;--focus:#ffffff;--tag-k-bg:#ffffff;--tag-k-fg:#0c0d12;--fade:rgba(12,13,18,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Pretendard',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.7;transition:background .45s ease,color .45s ease}
.wrap{max-width:1120px;margin:0 auto}

.switch{position:fixed;top:16px;right:16px;z-index:50;width:108px;height:42px;border-radius:999px;cursor:pointer;border:1.5px solid var(--ink);background:var(--bg);color:var(--mute);font:inherit;font-size:12px;font-weight:800;letter-spacing:.16em;transition:background .45s,border-color .45s}
.switch .lab{position:absolute;top:50%;transform:translateY(-50%)}
.switch .l-off{left:16px}
.switch .l-on{right:18px}
.switch .knob{position:absolute;top:3px;left:3px;width:54px;height:33px;border-radius:999px;background:#2340ff;color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.3,.9,.3,1);box-shadow:0 2px 10px rgba(35,64,255,.35)}
.switch[aria-checked="true"] .knob{transform:translateX(46px)}
.switch:focus-visible{outline:3px solid #2340ff;outline-offset:3px}

.sec-head{padding:78px 32px 8px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.24em;color:var(--blue-text);transition:color .45s}
.sec-head h2{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.25;margin-top:8px}
.sec-head p{color:var(--text);margin-top:8px;font-size:15px}

.profiles{display:flex;flex-direction:column;gap:28px;padding:28px 32px 16px}
.card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);background:var(--card);transition:background .45s,border-color .45s}
.card.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.card.swap{animation:swapIn .5s ease}
@keyframes swapIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.photo{position:relative;aspect-ratio:4/5;overflow:hidden;background:linear-gradient(160deg,#9fe7ee 0%,#c9c4f2 38%,#f6d3e4 78%,#f3f3f8 100%)}
.card.two .photo{aspect-ratio:10/9}
.photo.pg{background:radial-gradient(60% 40% at 15% 20%,rgba(190,205,120,.9),transparent 70%),radial-gradient(55% 45% at 85% 30%,rgba(150,170,80,.85),transparent 70%),linear-gradient(170deg,#7d8a4e 0%,#a6a98a 45%,#4e4a3c 100%)}
.pp{position:absolute;inset:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.pcell{position:relative;overflow:hidden}
.pcell+.pcell{border-left:2px solid var(--bg);transition:border-color .45s}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.photo .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:800;color:rgba(255,255,255,.6);letter-spacing:-.05em}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(to top,var(--fade),transparent)}
.cap{position:absolute;right:10px;bottom:10px;z-index:3;font-size:11px;font-weight:800;letter-spacing:.14em;padding:3px 9px;background:var(--ink);color:var(--bg);transition:background .45s,color .45s}
.focus{position:absolute;left:18%;top:20%;width:60%;height:38%;border:1.5px solid var(--focus);z-index:2;transition:border-color .45s}
.focus i{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--focus)}
.focus i:nth-child(1){left:-8px;top:-8px}
.focus i:nth-child(2){right:-8px;top:-8px}
.focus i:nth-child(3){left:-8px;bottom:-8px}
.focus i:nth-child(4){right:-8px;bottom:-8px}
.x{position:absolute;color:#2340ff;font-weight:800;font-size:16px;z-index:2}
.badge{position:absolute;left:14px;top:12px;z-index:3;font-size:11px;font-weight:800;letter-spacing:.18em;display:flex;align-items:center;gap:8px;color:var(--ink)}
.badge::before{content:"";width:9px;height:9px;border-radius:50%;background:#2340ff}
.side{position:absolute;right:10px;top:40%;z-index:3;writing-mode:vertical-rl;font-size:11px;font-weight:800;letter-spacing:.3em;color:var(--ink)}
.nameplate{position:absolute;left:0;bottom:44px;z-index:3;background:#2340ff;color:#fff;font-size:24px;font-weight:800;padding:10px 22px 10px 20px;letter-spacing:-.02em;max-width:90%}
.bars{position:absolute;left:0;bottom:22px;z-index:3}
.bars span{display:block;height:5px;background:#2340ff;margin-top:5px}
.bars span:nth-child(1){width:54px}.bars span:nth-child(2){width:34px}
.info{display:flex;flex-direction:column}
.body{padding:28px 30px 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:800;padding:6px 14px;background:var(--tag-k-bg);color:var(--tag-k-fg);letter-spacing:.04em;transition:background .45s,color .45s}
.tag.b{background:#2340ff;color:#fff}
.qmark{color:#2340ff;font-size:44px;font-weight:800;line-height:1;margin:18px 0 0;font-family:Georgia,serif}
.quote{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1.4;margin-top:4px;white-space:pre-line}
.desc{color:var(--text);font-size:14.5px;margin-top:14px}
.desc p{white-space:pre-line}
.desc p+p{margin-top:12px}
.spec{margin:22px 30px 30px;border-top:1px solid var(--line);margin-top:auto}
.spec div{display:grid;grid-template-columns:96px 1fr;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.spec dt{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--mute)}
.spec dd{font-weight:700;font-size:15px}
.body + .spec{margin-top:22px}

.extras{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:-12px}
.ex{border:1px solid var(--line);border-top:4px solid #2340ff;background:var(--card);padding:26px 28px;transition:background .45s,border-color .45s}
.ex:nth-child(even){border-top-color:var(--ink)}
.ex.wide{grid-column:1/-1}
.ex h3{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.35}
.ex .desc{margin-top:12px}
.ls{margin-top:10px}
.ls .li{position:relative;padding:7px 0 7px 20px;font-size:14.5px;color:var(--text);line-height:1.7}
.ls .li::before{content:"";position:absolute;left:2px;top:17px;width:7px;height:7px;background:#2340ff}

.pmt{border:1px solid var(--line);border-top:4px solid #2340ff;background:var(--card);padding:26px 28px;margin-top:-12px;transition:background .45s,border-color .45s}
.pmt-h{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;cursor:pointer;list-style:none}
.pmt-h::-webkit-details-marker{display:none}
.pmt-t{display:flex;align-items:center;gap:12px;min-width:0}
.pmt-ar{width:10px;height:10px;border-right:3px solid var(--blue-text);border-bottom:3px solid var(--blue-text);transform:rotate(-45deg);transition:transform .2s;flex:none;margin:0 4px 4px 2px}
.pmt[open] .pmt-ar{transform:rotate(45deg);margin-bottom:6px}
.pmt h3{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.35}
.pmt-note{color:var(--text);font-size:14px;margin-top:16px;white-space:pre-line}
.pcopy{font:inherit;font-size:13px;font-weight:800;letter-spacing:.04em;padding:10px 20px;border:1.5px solid #2340ff;background:#2340ff;color:#fff;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.pcopy:hover{background:#1a31d6;border-color:#1a31d6}
.pcopy.done{background:transparent;color:var(--blue-text);border-color:var(--blue-text)}
.pmt-text{margin-top:16px;padding:18px 20px;background:var(--blue-soft);border-left:4px solid #2340ff;font-size:14px;line-height:1.85;color:var(--ink);white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto;transition:background .45s}
footer{padding:28px 32px 48px;border-top:1px solid var(--line);margin-top:32px;font-size:12px;color:var(--mute);letter-spacing:.08em;transition:border-color .45s}

@media (max-width:820px){
  .profiles{padding:20px 16px;gap:20px}
  .card,.card.two{grid-template-columns:1fr}
  .body{padding:24px 24px 8px}
  .spec{margin:22px 24px 24px}
  .sec-head{padding:76px 16px 8px}
  .sec-head h2{font-size:28px}
  .extras{grid-template-columns:1fr;margin-top:-4px}
  .ex{padding:22px 22px}
  .pmt{margin-top:-4px;padding:22px}
  .pcopy{width:100%}
  footer{padding-left:16px;padding-right:16px}
}
</script>

<script type="text/plain" id="v-body">
<button class="switch" id="switch" role="switch" aria-checked="false" aria-label="OFF / ON 전환">
  <span class="lab l-off">OFF</span>
  <span class="lab l-on">ON</span>
  <span class="knob" id="knob">OFF</span>
</button>
<main class="wrap">
  <section id="sec-prof">
    <div class="sec-head">
      <div class="eyebrow" id="eyebrow"></div>
      <h2 id="t-prof-h"></h2>
      <p id="t-prof-p"></p>
    </div>
    <div class="profiles" id="profiles"></div>
  </section>
</main>
<footer id="footer"></footer>
</script>

<script type="text/plain" id="v-js">
(function(){
  const IN_EDITOR = window.parent !== window;
  let DATA = window.__DATA__ || {};
  let mode = 'off';
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const list = a => Array.isArray(a) ? a : [];
  const FOCUS = '<div class="focus"><i></i><i></i><i></i><i></i></div>';

  function card(m, c, animate){
    const imgs = [['전신', c.imageFull], ['프로필', c.imageFace]].filter(x => x[1]);
    let cells;
    if(!imgs.length){
      cells = '<div class="pcell"><div class="ph">' + esc(String(c.name || '').slice(0,1)) + '</div>' + FOCUS + '</div>';
    } else {
      cells = imgs.map((x, k) => '<div class="pcell"><img src="' + esc(x[1]) + '" alt="' + esc(x[0]) + '"><span class="cap">' + x[0] + '</span>' + (k === imgs.length - 1 ? FOCUS : '') + '</div>').join('');
    }
    return `
    <article class="card ${imgs.length > 1 ? 'two' : ''} ${animate ? 'swap' : ''}">
      <div class="photo ${m === 'on' ? 'pg' : ''}">
        <div class="pp">${cells}</div>
        <div class="badge">${esc(c.focus)}</div>
        <span class="x" style="right:8%;top:20%">×</span>
        <span class="x" style="left:3%;top:72%">×</span>
        <div class="side">${esc(c.side)}</div>
        <div class="nameplate">${esc(c.name)}</div>
        <div class="bars"><span></span><span></span></div>
      </div>
      <div class="info">
        <div class="body">
          <div class="tags">${list(c.tags).map(t => `<span class="tag ${t[1] === 'b' ? 'b' : ''}">${esc(t[0])}</span>`).join('')}</div>
          ${c.quote ? `<div class="qmark">“</div><div class="quote">${esc(c.quote)}</div>` : ''}
          <div class="desc">${list(c.desc).map(p => `<p>${esc(p)}</p>`).join('')}</div>
        </div>
        <dl class="spec">${list(c.spec).map(s => `<div><dt>${esc(s[0])}</dt><dd>${esc(s[1])}</dd></div>`).join('')}</dl>
      </div>
    </article>`;
  }

  function extras(c){
    const ex = list(c.extras).filter(e => e && e.on && String(e.text == null ? '' : e.text).trim());
    if(!ex.length) return '';
    return '<div class="extras">' + ex.map(e => {
      const t = String(e.text).replace(/\r/g, '');
      let body;
      if(e.kind === 'list'){
        body = '<div class="ls">' + t.split('\n').map(x => x.trim().replace(/^[-•·*]\s*/, '')).filter(Boolean).map(x => '<div class="li">' + esc(x) + '</div>').join('') + '</div>';
      } else {
        body = '<div class="desc">' + t.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p => '<p>' + esc(p) + '</p>').join('') + '</div>';
      }
      return '<div class="ex ' + (e.kind === 'list' ? '' : 'wide') + '">' +
        (e.eyebrow ? '<div class="eyebrow">' + esc(e.eyebrow) + '</div>' : '') +
        (e.title ? '<h3>' + esc(e.title) + '</h3>' : '') + body + '</div>';
    }).join('') + '</div>';
  }

  function promptBox(c){
    const p = c.prompt || {};
    if(p.on === false || !String(p.text == null ? '' : p.text).trim()) return '';
    const btn = esc(p.btn || '프롬프트 복사');
    return '<details class="pmt"' + (p.fold ? '' : ' open') + '><summary class="pmt-h"><div class="pmt-t"><span class="pmt-ar"></span><div>' +
      (p.eyebrow ? '<div class="eyebrow">' + esc(p.eyebrow) + '</div>' : '') +
      (p.title ? '<h3>' + esc(p.title) + '</h3>' : '') +
      '</div></div>' +
      '<button type="button" class="pcopy" data-copy data-copied="복사됨 ✓" data-label="' + btn + '">' + btn + '</button></summary><div class="pmt-b">' + (p.note ? '<div class="pmt-note">' + esc(p.note) + '</div>' : '') +
      '<div class="pmt-text">' + esc(p.text) + '</div></div></details>';
  }

  function copyText(t, done){
    const fb = () => {
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
      ta.remove(); done(ok);
    };
    if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(() => done(true), fb);
    else fb();
  }

  function renderTexts(){
    const t = DATA.texts || {};
    const set = (id, v) => { const e = $(id); if(e) e.textContent = v == null ? '' : v; };
    set('#t-prof-h', t.profTitle); set('#t-prof-p', t.profSub);
    set('#footer', t.footer);
    if(t.pageTitle) document.title = t.pageTitle;
  }

  function renderProfiles(animate){
    const p = (DATA.profiles && DATA.profiles[mode]) || {meta:[], c:{}};
    $('#eyebrow').textContent = list(p.meta).filter(Boolean).join(' · ');
    $('#profiles').innerHTML = card(mode, p.c || {}, animate) + extras(p.c || {}) + promptBox(p.c || {});
  }

  function setMode(m, animate){
    mode = m === 'on' ? 'on' : 'off';
    document.body.dataset.mode = mode;
    $('#switch').setAttribute('aria-checked', mode === 'on');
    $('#knob').textContent = mode === 'on' ? 'ON' : 'OFF';
    renderProfiles(!!animate);
    if(!IN_EDITOR){ try{ localStorage.setItem('profile-mode', mode); }catch(e){} }
  }

  function renderAll(animate){ renderTexts(); setMode(mode, animate); }

  $('#switch').addEventListener('click', () => setMode(mode === 'on' ? 'off' : 'on', true));

  document.addEventListener('click', e => {
    const b = e.target.closest ? e.target.closest('[data-copy]') : null;
    if(!b) return;
    e.preventDefault();
    const box = b.closest('.pmt'); const tx = box && box.querySelector('.pmt-text');
    if(!tx) return;
    copyText(tx.textContent.trim(), ok => {
      b.textContent = ok ? b.getAttribute('data-copied') : '복사 실패 · 직접 선택해 주세요';
      b.classList.toggle('done', ok);
      clearTimeout(b._t);
      b._t = setTimeout(() => { b.textContent = b.getAttribute('data-label'); b.classList.remove('done'); }, 1800);
    });
  });

  window.addEventListener('message', e => {
    const d = e.data; if(!d || !d.type) return;
    if(d.type === 'pe-update'){
      if(d.data) DATA = d.data;
      let changedMode = false;
      if(d.mode && d.mode !== mode){ mode = d.mode; changedMode = true; }
      renderAll(changedMode);
    }
    if(d.type === 'pe-scroll'){
      const el = d.target ? document.getElementById(d.target) : null;
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
      else window.scrollTo({top:0, behavior:'smooth'});
    }
  });

  if(!IN_EDITOR){ try{ if(localStorage.getItem('profile-mode') === 'on') mode = 'on'; }catch(e){} }
  renderAll(false);
})();
</script>

const STORE = 'profile-page-single-editor-v1';

function normChar(c, d){
  c = Object.assign({}, d, c || {});
  ['tags','desc','spec','extras'].forEach(k => { if(!Array.isArray(c[k])) c[k] = clone(d[k]); });

  ['eyebrow','title','note','text','btn'].forEach(k => { c.prompt[k] = c.prompt[k] == null ? '' : String(c.prompt[k]); });
  c.extras = c.extras.filter(e => e && typeof e === 'object');

function norm(o){

}

/* ---------- 폼 빌더 ---------- */
function h(tag, attrs, ...kids){

    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);

  kids.flat().forEach(c => { if(c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const get = p => p.reduce((o,k) => o[k], S);

/* 이미지 업로드 (자동 리사이즈 → base64) */
function fileToDataURL(file, max){
  max = max || 1400;
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .88));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function IMG(path, label){
  const cur = get(path) || '';
  const isData = cur.startsWith('data:');

  const file = h('input', {type:'file', accept:'image/*', hidden:true});
  file.addEventListener('change', async () => {
    const f = file.files[0]; if(!f) return;
    try{ const url = await fileToDataURL(f); setv(path, url); structural(); flash('사진을 넣었어요'); }
    catch(e){ flash('이미지를 읽지 못했어요'); }
  });
  const kb = isData ? Math.round(cur.length * .75 / 1024) : 0;
  const url = h('input', {type:'text', placeholder:'또는 이미지 주소(URL) 붙여넣기'});
  url.value = isData ? '' : cur;
  url.addEventListener('change', () => { setv(path, url.value.trim()); structural(); });
  return h('div', {class:'f'},
    h('span', {class:'lb'}, label || '사진'),
    h('div', {class:'img'}, thumb,
      h('div', {},
        h('div', {class:'btns'},
          h('button', {class:'sbtn blue', type:'button', onclick:() => file.click()}, cur ? '사진 바꾸기' : '사진 올리기'),
          cur ? h('button', {class:'sbtn', type:'button', onclick:() => { setv(path, ''); structural(); }}, '삭제') : null),
        url,
        h('div', {class:'hint'}, isData ? `내장 이미지 · 약 ${kb}KB (HTML 안에 함께 저장돼요)` : '비워 두면 이 사진은 나오지 않아요.')),
      file));
}

function formBase(){

    det('t-prof', '페이지 문구', [T('제목','profTitle'), T('설명 (비우면 숨김)','profSub')], true),
    det('t-etc', '기타', [T('브라우저 탭 제목','pageTitle'), T('맨 아래 문구','footer')], false)
  ];

<script>
/* ---------- 이미지 저장 (화면 공유 없이, 페이지를 그대로 PNG로 변환) ---------- */
(function(){
  const btn = document.getElementById('btnImage');
  const statusEl = document.getElementById('status');
  const LIB = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js';
  const FONT_CSS = 'https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css';
  const WEIGHTS = ['400','700','800'];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let busy = false, fontCache = null, warned = false;

  function say(m){ statusEl.textContent = m; }
  function done(m){ say(m); setTimeout(() => { statusEl.textContent = '자동 저장됨'; }, 3600); }

  function toDataURL(blob){
    return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
  }

  async function buildFontCSS(){
    if(fontCache !== null) return fontCache;
    let out = '';
    try{
      const css = await (await fetch(FONT_CSS)).text();
      const blocks = css.match(/@font-face\s*\{[^}]*\}/g) || [];
      for(const b of blocks){
        const w = (b.match(/font-weight\s*:\s*(\d+)/) || [])[1];
        if(!WEIGHTS.includes(w)) continue;
        const m = b.match(/url\(\s*['"]?([^'")]+?\.woff2)['"]?\s*\)/) || b.match(/url\(\s*['"]?([^'")]+?)['"]?\s*\)/);
        if(!m) continue;
        const blob = await (await fetch(new URL(m[1], FONT_CSS).href)).blob();
        out += "@font-face{font-family:'Pretendard';font-weight:" + w + ";font-style:normal;src:url(" + await toDataURL(blob) + ");}\n";
      }
    }catch(e){ console.warn('font embed failed', e); out = ''; }
    fontCache = out;
    return out;
  }

  function loadLib(win, doc){
    if(win.htmlToImage) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = doc.createElement('script');
      s.src = LIB; s.onload = () => res(); s.onerror = () => rej(new Error('lib'));
      doc.head.append(s);
    });
  }

  async function save(){
    if(busy) return;
    busy = true; btn.disabled = true;
    const iframe = document.getElementById('preview');
    let idoc = null, root = null, oldBehavior = '', oldY = 0;
    try{
      const win = iframe.contentWindow; idoc = iframe.contentDocument; root = idoc.documentElement;
      say('이미지 준비 중…');
      await loadLib(win, idoc);
      const fontCSS = await buildFontCSS();
      if(!fontCSS && !warned){ warned = true; alert('폰트를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.\n이번 이미지는 글꼴이 다르게 나올 수 있어요.'); }

      oldBehavior = root.style.scrollBehavior; root.style.scrollBehavior = 'auto';
      oldY = win.scrollY; win.scrollTo(0, 0);
      idoc.querySelectorAll('.card.swap').forEach(c => c.classList.remove('swap'));
      if(idoc.fonts && idoc.fonts.ready) await idoc.fonts.ready;
      await wait(300);

      const body = idoc.body;
      const cw = root.clientWidth, H = Math.max(root.scrollHeight, body.scrollHeight);
      let pr = Math.min(2, 16000 / H, Math.sqrt(120e6 / (cw * H)));
      pr = Math.max(0.25, pr);
      const bg = win.getComputedStyle(body).backgroundColor || '#ffffff';
      const opt = {
        width: cw, height: H, pixelRatio: pr, backgroundColor: bg,
        fontEmbedCSS: fontCSS, cacheBust: false,
        style: { margin: '0', transition: 'none', animation: 'none' },
        filter: n => !(n.id === 'switch') && !(n.classList && n.classList.contains('pcopy'))
      };
      const h2i = win.htmlToImage;
      await h2i.toCanvas(body, Object.assign({}, opt, { pixelRatio: 0.2 }));
      say('이미지 만드는 중…');
      const cv = await h2i.toCanvas(body, opt);
      const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
      if(!blob) throw new Error('blob');

      const a = document.createElement('a');
      const dev = document.querySelector('#segDevice button.on');
      const mode = document.querySelector('#segMode button.on');
      a.href = URL.createObjectURL(blob);
      a.download = 'profile-page-' + (mode ? mode.dataset.m : 'off') + '-' + (dev ? dev.dataset.d : 'desktop') + '.png';
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      done('이미지를 저장했어요' + (pr < 2 ? ' (크기가 커서 해상도 낮춤)' : ''));
    }catch(e){
      console.error(e);
      done(e && e.message === 'lib' ? '이미지 도구를 불러오지 못했어요 (인터넷 확인)' : '이미지 저장에 실패했어요');
    }finally{
      try{ if(root){ root.style.scrollBehavior = oldBehavior; iframe.contentWindow.scrollTo(0, oldY); } }catch(_){}
      busy = false; btn.disabled = false;
    }
  }
  btn.addEventListener('click', save);
})();
</script>
<script type="text/plain" id="e-js">
(function(){
var root=document.getElementById('__PPID__');
if(!root){return;}
if(root.getAttribute('data-ready')){return;}
root.setAttribute('data-ready','1');
var mode='off';
function q(s){return root.querySelector(s);}
function each(list,fn){Array.prototype.forEach.call(list,fn);}
function setMode(m){
  mode=(m==='on')?'on':'off';
  root.setAttribute('data-mode',mode);
  q('.switch').setAttribute('aria-checked',mode==='on'?'true':'false');
  q('[data-pp="knob"]').textContent=(mode==='on')?'ON':'OFF';
  var eb=q('[data-pp="eyebrow"]');
  eb.textContent=eb.getAttribute('data-'+mode)||'';
  var off=q('[data-pp="pf-off"]');
  var on=q('[data-pp="pf-on"]');
  off.style.display=(mode==='on')?'none':'';
  on.style.display=(mode==='on')?'':'none';
  var shown=(mode==='on')?on:off;

}
q('.switch').addEventListener('click',function(){setMode(mode==='on'?'off':'on');});
root.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-copy]'):null;
  if(!b){return;}
  e.preventDefault();
  var box=b.closest('.pmt');
  var tx=box?box.querySelector('.pmt-text'):null;
  if(!tx){return;}
  var t=tx.textContent.replace(/^\s+|\s+$/g,'');
  function done(ok){
    b.textContent=ok?b.getAttribute('data-copied'):'복사 실패 · 직접 선택해 주세요';
    if(ok){b.classList.add('done');}else{b.classList.remove('done');}
    clearTimeout(b._t);
    b._t=setTimeout(function(){b.textContent=b.getAttribute('data-label');b.classList.remove('done');},1800);
  }
  function fb(){
    var ta=document.createElement('textarea');
    ta.value=t;ta.style.cssText='position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy');}catch(x){}
    document.body.removeChild(ta);done(ok);
  }
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){done(true);},fb);}else{fb();}
});
})();

<script>
/* ---------- 티스토리용 내보내기 (글 안에서만 적용되는 한 덩어리 HTML) ---------- */
(function(){
  var FONT = 'https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css';
  var btn = document.getElementById('btnBlog');
  var busy = false;
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  function scopeCSS(css, sc){
    css = css.replace(/\/\*[\s\S]*?\*\//g, '');
    function mapSel(s){
      s = s.trim();
      if(s === ':root') return sc;
      if(s === 'html') return null;
      if(s === '*') return sc + ' *';
      if(/^body\b/.test(s)) return s.replace(/^body/, sc);
      return sc + ' ' + s;
    }
    function walk(str){
      var out = '', i = 0, n = str.length;
      while(i < n){
        var b = str.indexOf('{', i);
        if(b < 0) break;
        var pre = str.slice(i, b).trim();
        var d = 1, j = b + 1;
        while(j < n && d > 0){ var ch = str.charAt(j); if(ch === '{') d++; else if(ch === '}') d--; j++; }
        var inner = str.slice(b + 1, j - 1);
        i = j;
        if(pre.charAt(0) === '@'){
          if(/^@media/.test(pre)) out += pre.replace(/^@media/, '@container') + '{' + walk(inner) + '}';
          else out += pre + '{' + inner + '}';
        } else {
          var sels = pre.split(',').map(mapSel).filter(function(x){ return x !== null; });
          if(sels.length) out += sels.join(',') + '{' + inner + '}';
        }
      }
      return out;
    }
    return walk(css);
  }

  function makeFrame(){
    return new Promise(function(res, rej){
      var f = document.createElement('iframe');
      f.style.cssText = 'position:fixed;left:-99999px;top:0;width:1200px;height:900px;border:0;visibility:hidden';
      var t = setTimeout(function(){ rej(new Error('timeout')); }, 8000);
      f.addEventListener('load', function(){ clearTimeout(t); res(f); });
      f.srcdoc = buildHTML(S);
      document.body.append(f);
    });
  }

  async function buildEmbed(){
    var f = await makeFrame();
    try{
      var w = f.contentWindow, d = f.contentDocument;
      w.postMessage({type:'pe-update', data:S, mode:'on'}, '*');
      await wait(250);
      var eyeOn = d.getElementById('eyebrow').textContent;
      var pfOn = d.getElementById('profiles').innerHTML;
      w.postMessage({type:'pe-update', data:S, mode:'off'}, '*');
      await wait(250);

      var main = d.querySelector('main.wrap').cloneNode(true);
      var sw = d.getElementById('switch').cloneNode(true);
      var foot = d.getElementById('footer').cloneNode(true);

      var prof = main.querySelector('#profiles');
      var eb = main.querySelector('#eyebrow');
      eb.setAttribute('data-pp', 'eyebrow');
      eb.setAttribute('data-off', eb.textContent);
      eb.setAttribute('data-on', eyeOn);
      prof.setAttribute('data-pp', 'pf-off');
      var on = prof.cloneNode(false);
      on.setAttribute('data-pp', 'pf-on');
      on.innerHTML = pfOn;
      on.style.display = 'none';
      prof.after(on);
      main.querySelectorAll('.swap').forEach(function(e){ e.classList.remove('swap'); });
      main.querySelectorAll('dl.spec').forEach(function(dl){
        var box = document.createElement('div');
        box.className = 'spec';
        Array.prototype.forEach.call(dl.children, function(row){
          var dt = row.querySelector('dt'), dd = row.querySelector('dd');
          var r = document.createElement('div');
          var k = document.createElement('span'); k.className = 'k'; k.textContent = dt ? dt.textContent : '';
          var v = document.createElement('span'); v.className = 'v'; v.textContent = dd ? dd.textContent : '';
          r.append(k, v); box.append(r);
        });
        dl.replaceWith(box);
      });

      var knob = sw.querySelector('#knob');
      knob.setAttribute('data-pp', 'knob');
      knob.textContent = 'OFF';
      sw.setAttribute('aria-checked', 'false');
      main.querySelectorAll('[id]').forEach(function(e){ e.removeAttribute('id'); });
      sw.removeAttribute('id'); knob.removeAttribute('id'); foot.removeAttribute('id');

      var id = 'pp' + Math.random().toString(36).slice(2, 8);
      var sc = '#' + id;
      var css = scopeCSS(document.getElementById('v-css').textContent, sc);
      css += sc + '{position:relative;container-type:inline-size;text-align:left}' + sc + ' .switch{position:absolute}';
      css += sc + ' .spec .k{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--mute)}' + sc + ' .spec .v{font-weight:700;font-size:15px}';
      css = css.replace(/\s*\n\s*/g, ' ');
      var js = document.getElementById('e-js').textContent.replace(/__PPID__/g, id);
      var body = (sw.outerHTML + main.outerHTML + foot.outerHTML).replace(/>\s+</g, '><');
      return '<div id="' + id + '" data-mode="off"><style>@import url(\'' + FONT + '\');' + css + '</style>' +
        body + '<scr' + 'ipt>\n' + js + '\n</scr' + 'ipt></div>';
    } finally { f.remove(); }
  }

  function saveFile(text){
    var blob = new Blob([text], {type:'text/html;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'profile-tistory.html';
    document.body.append(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  }

  btn.addEventListener('click', async function(){
    if(busy) return;
    busy = true; btn.disabled = true;
    flash('티스토리용 HTML 만드는 중…', true);
    try{
      var html = await buildEmbed();
      var big = html.length > 1500000;
      try{
        await navigator.clipboard.writeText(html);
        flash(big ? '복사했어요 · 용량이 커요(사진이 내장됨), 사진 주소(URL) 사용을 권장해요' : '티스토리용 HTML을 복사했어요 → 글쓰기 HTML 모드에 붙여넣기');
      }catch(e){
        saveFile(html);
        flash('복사가 막혀서 파일(profile-tistory.html)로 저장했어요');
      }
    }catch(e){
      console.error(e);
      flash('티스토리용 내보내기에 실패했어요');
    }finally{ busy = false; btn.disabled = false; }
  });
})();
</script>
